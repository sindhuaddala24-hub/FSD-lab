<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            /* Content */
            width: 300px;
            height: 100px;

            /* Padding */
            padding: 20px;

            /* Border */
            border: 5px solid black;

            /* Margin */
            margin: 50px;

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="box">
        This is the Content.
    </div>

</body>
</html>
