<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        .name {
            color: red;
        }

        .hex {
            color: #0000ff;
        }

        .rgb {
            color: rgb(0, 128, 0);
        }

        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <h1 class="name">Color using Name</h1>
    <h2 class="hex">Color using HEX</h2>
    <h2 class="rgb">Color using RGB</h2>
    <h2 class="rgba">Color using RGBA</h2>

</body>
</html>
