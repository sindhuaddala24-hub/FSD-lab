<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            font-size: 28px;
        }

        p {
            color: green;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; background-color: yellow;">
        Inline CSS
    </h1>

    <h2>
        Internal CSS
    </h2>

    <p>
        This paragraph uses internal CSS.
    </p>

    <div class="box">
        This div uses external CSS.
    </div>

</body>
</html>
